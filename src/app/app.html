@if (!selectedService) {
  <app-service-selection
    (serviceSelected)="onServiceSelected($event)"
  ></app-service-selection>
} @else if (!applicantContext) {
  <app-applicant-questionnaire
    (contextSubmitted)="onApplicantContextSubmitted($event)"
  ></app-applicant-questionnaire>
} @else {
  <app-requirements-checker
    [service]="selectedService"
    [context]="applicantContext"
  ></app-requirements-checker>
}
